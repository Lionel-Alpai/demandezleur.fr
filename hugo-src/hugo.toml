baseURL = "https://demandezleur.fr/"
languageCode = "fr"
title = "demandezleur.fr — Interrogez leurs programmes"
theme = "demandezleur"
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Posez vos questions aux programmes officiels des candidats à la présidentielle 2027, et faites-les débattre. Réponses sourcées, prompts publics, code ouvert, aucun traceur."
  apiBase = "/api"
  maxDebatTours = 5
  ogImage = "/img/og.png"

# Mesure d'audience sans cookie (Umami). Vide = rien n'est chargé.
[params.umami]
  url = "https://stats.cassandria.space/script.js"
  siteId = "bd40a63e-cce8-4f60-9a07-01c1f682fbe4"

[markup.goldmark.renderer]
  unsafe = true

# Blocs de code : classes CSS plutôt que styles inline (page Transparence)
[markup.highlight]
  noClasses = false
  codeFences = true
