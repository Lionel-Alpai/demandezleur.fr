<div class="chat-preview" id="chatPreview">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="chat-avatar" id="chatAvatar"></div>
      <div class="chat-cname" id="chatName"></div>
    </div>
    <button class="chat-close" id="chatClose">&times;</button>
  </div>
  <div class="chat-body">
    <div class="chat-greeting" id="chatGreeting"></div>
    <form id="chatForm" action="/candidats/" method="GET" class="chat-input-row">
      <input type="text" name="q" class="chat-input" placeholder="votre question..." required>
      <button type="submit" class="chat-send">&rsaquo;</button>
    </form>
  </div>
</div>
